<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="MIRYS">
<meta property="og:description" content="MIRYS est en veille. Réveillez-la.">
<meta property="og:image" content="img/poster.jpg">
<title>MIRYS</title>
<meta name="description" content="MIRYS est en veille. Réveillez-la.">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap">
<style>
/* Noir complet. Une seule lumière : le voyant de MIRYS en veille. Réveillée, la lumière devient une goutte qui tombe,
   s'écrase sur un verre noir invisible et en allume le contour. Chaque présentation vit dans un de ces verres ;
   on passe à la suivante en faisant défiler : la lumière glisse vers le bas, éteint tout, et goutte à nouveau. */
:root {
  color-scheme: dark;
  --void: #000;
  --text: #f4f4f7;
  --soft: rgba(244, 244, 247, 0.74);
  --muted: rgba(244, 244, 247, 0.46);
  --ok: #4ade80;
  --standby: #e2eaff;
  --liquid: cubic-bezier(0.22, 1, 0.36, 1);
  --spring: cubic-bezier(0.2, 0.9, 0.25, 1.12);
  --out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-soft: cubic-bezier(0.34, 1.32, 0.64, 1);
  --land: cubic-bezier(0.3, 0.95, 0.3, 1.04);
  --glass: linear-gradient(180deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0) 30%), linear-gradient(180deg, #050507 20%, rgba(5, 5, 7, 0.6) 100%);
  --glass-open: radial-gradient(120% 50% at 50% -18%, rgba(255, 255, 255, 0.06), transparent 62%), linear-gradient(180deg, #050507 20%, rgba(5, 5, 7, 0.82) 100%);
  --card: rgba(20, 20, 25, 0.86);
  --card-sheen: linear-gradient(160deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.015) 50%, rgba(255, 255, 255, 0.04));
  --nova: linear-gradient(135deg, #5b8cff, #a855f7);
  --ui: "Segoe UI Variable Text", "Segoe UI", Inter, system-ui, sans-serif;
  --display: "Segoe UI Variable Display", "Segoe UI", Inter, system-ui, sans-serif;
  --mark: Inter, "Segoe UI", system-ui, sans-serif;
  --ink: var(--text);
  --mute: #8b8b96;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
html { background: #000; }
body { margin: 0; overflow: hidden; background: #000; color: var(--text); font-family: var(--ui); font-size: 15px; -webkit-font-smoothing: antialiased; touch-action: none; }
button, input { font: inherit; color: inherit; }
a { color: inherit; }
svg { fill: currentColor; }
:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.6); outline-offset: 3px; }

/* =====================================================================
   L'ÎLE : reprise fidèle de MIRYS (verre fumé, reflet du contour, ressort, tailles réelles)
   ===================================================================== */
@property --hx { syntax: '<percentage>'; inherits: false; initial-value: 100%; }
@property --hy { syntax: '<percentage>'; inherits: false; initial-value: 0%; }
@property --hr { syntax: '<length>'; inherits: false; initial-value: 46px; }
@property --pk { syntax: '<number>'; inherits: false; initial-value: 0.5; }
@property --a { syntax: '<angle>'; initial-value: 30deg; inherits: false; }

.isl { position: absolute; left: 50%; top: calc(8px * var(--k, 1)); width: 160px; height: 36px; border-radius: 18px; transform: translateX(-50%) scale(var(--k, 1)); transform-origin: 50% 0;
  isolation: isolate; color: var(--ink); font-family: var(--ui); line-height: 1.3; user-select: none; box-shadow: 0 10px 34px rgba(0, 0, 0, 0.3);
  transition: width 0.38s var(--spring), height 0.38s var(--spring), border-radius 0.38s ease, opacity 0.3s ease, transform 0.45s var(--spring); }
.isl::before { content: ''; position: absolute; inset: 0; border-radius: inherit; background: var(--glass); z-index: -1; }
.isl.open::before, .isl[data-s="compose"]::before, .isl[data-s="music"]::before { background: var(--glass-open); }
.isl .edge { position: absolute; inset: 0; z-index: 3; border-radius: inherit; padding: 1px; pointer-events: none;
  --hx: 100%; --hy: 0%; --hr: 46px; --pk: 0.5;
  background:
    radial-gradient(circle var(--hr) at var(--hx) var(--hy), rgba(255, 255, 255, var(--pk)) 0%, rgba(255, 255, 255, calc(var(--pk) * 0.4)) 40%, rgba(255, 255, 255, 0) 100%),
    radial-gradient(circle calc(var(--hr) * 0.75) at calc(100% - var(--hx)) calc(100% - var(--hy)), rgba(255, 255, 255, calc(var(--pk) * 0.5)) 0%, rgba(255, 255, 255, 0) 100%),
    linear-gradient(rgba(140, 140, 150, 0.15), rgba(140, 140, 150, 0.15));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
  transition: --hx 0.45s cubic-bezier(0.25, 0.8, 0.3, 1), --hy 0.45s cubic-bezier(0.25, 0.8, 0.3, 1), --hr 0.38s ease, --pk 0.35s ease; }
.isl:not([data-s="pill"]) .edge { --hr: 70px; }
.isl.open .edge, .isl[data-s="compose"] .edge { --hr: 120px; --pk: 0.6; }
.isl.lit .edge { --pk: 0.72; }
.isl .clip { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; }
.ly { position: absolute; inset: 0; display: flex; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.15s ease; }
.isl[data-s="pill"] .ly-pill, .isl[data-s="notif"] .ly-notif, .isl[data-s="info"] .ly-info, .isl[data-s="voice"] .ly-voice, .isl[data-s="music"] .ly-music,
.isl[data-s="compose"] .ly-compose, .isl[data-s="callin"] .ly-callin, .isl[data-s="call"] .ly-call, .isl[data-s="drop"] .ly-drop, .isl[data-s="ask"] .ly-ask,
.isl[data-s="code"] .ly-code, .isl[data-s="file"] .ly-file, .isl[data-s="match"] .ly-match, .isl[data-s="nav"] .ly-nav
{ opacity: 1; pointer-events: auto; transition: opacity 0.25s ease 0.15s; }

/* Tailles réelles de l'appli (px avant mise à l'échelle) */
.isl[data-s="notif"] { width: 380px; height: 68px; border-radius: 26px; }
.isl[data-s="info"] { width: var(--bw, 380px); height: 42px; border-radius: 21px; }
.isl[data-s="voice"] { width: 250px; height: 40px; border-radius: 20px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14), inset 0 0 14px rgba(255, 255, 255, 0.06), 0 0 18px rgba(255, 255, 255, 0.12), 0 8px 30px rgba(0, 0, 0, 0.45); }
.isl[data-s="music"] { width: 420px; height: 80px; border-radius: 28px; }
.isl[data-s="compose"] { width: 540px; height: 146px; border-radius: 30px; }
.isl[data-s="callin"], .isl[data-s="ask"], .isl[data-s="match"] { width: 440px; height: 100px; border-radius: 28px; }
.isl[data-s="call"] { width: 400px; height: 76px; border-radius: 27px; }
.isl[data-s="drop"] { width: 320px; height: 72px; border-radius: 28px; }
.isl[data-s="drop"] .edge { --pk: 0.8; --hr: 90px; }
.isl[data-s="code"] { width: 400px; height: 104px; border-radius: 28px; }
.isl[data-s="file"] { width: 440px; height: 118px; border-radius: 28px; }
.isl[data-s="rond"] { width: 36px; height: 36px; border-radius: 18px; }
.isl[data-s="hidden"] { opacity: 0; transform: translateX(-50%) scale(calc(var(--k, 1) * 0.6)); }

.ly-pill { justify-content: center; gap: 8px; font-size: 13px; font-weight: 600; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); flex: none; }
.isl.thinking .dot { background: #fbbf24; box-shadow: 0 0 8px #fbbf24; animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.5); opacity: 0.6; } }

.ly-notif, .ly-callin, .ly-call, .ly-ask, .ly-code, .ly-match { gap: 12px; padding: 0 18px 0 12px; }
.av { width: 44px; height: 44px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 18px; font-weight: 700; color: #fff; background: linear-gradient(135deg, #34c759, #1f8f45); }
.av.blue { background: linear-gradient(135deg, #5b8cff, #3159d6); }
.av.indigo { background: linear-gradient(135deg, #6d6ff2, #4338ca); }
.av.nuvio { background: linear-gradient(135deg, #6d8bff, #3b5bdb); }
.nt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ntop { display: flex; align-items: baseline; gap: 8px; }
.nfrom { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.napp { margin-left: auto; flex: none; font-size: 10.5px; color: var(--mute); }
.napp.acc { color: #a5b4fc; }
.nbody { font-size: 12.5px; line-height: 1.3; color: rgba(255, 255, 255, 0.78); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ly-info { justify-content: center; padding: 0 26px; font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.ly-voice canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

.acts { display: flex; gap: 6px; margin-top: 6px; }
.acts span { display: inline-flex; align-items: center; height: 26px; padding: 0 12px; border-radius: 13px; font-size: 11.5px; font-weight: 600; background: rgba(255, 255, 255, 0.08); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.08); transition: transform 0.15s ease, filter 0.2s ease; }
.acts .g { background: linear-gradient(180deg, #34c759, #1f8f45); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 4px 12px rgba(31, 143, 69, 0.35); }
.acts .r { background: linear-gradient(180deg, #ff5a52, #d92f27); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 4px 12px rgba(217, 47, 39, 0.3); }
.acts .w { background: #f2f2f5; color: #0b0b0f; box-shadow: inset 0 1px 0 #fff; }
.acts span.press { transform: scale(0.9); filter: brightness(1.25); }
.acts.pick span { cursor: pointer; }
.acts.pick span:hover { filter: brightness(1.2); }

/* Mini lecteur : la pochette diffuse ses couleurs derrière le verre */
.ly-music { gap: 12px; padding: 0 12px 0 11px; isolation: isolate; }
.ly-music::before { content: ''; position: absolute; inset: -40%; background: var(--art) center / cover no-repeat; filter: blur(34px) saturate(1.6); opacity: 0.42; z-index: -1; }
.cover { width: 58px; height: 58px; flex: none; border-radius: 14px; background: var(--art) center / cover no-repeat; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45), inset 0 0 0 1px rgba(255, 255, 255, 0.08); }
.mt { flex: 1; min-width: 0; }
.mt b { display: block; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mt span { display: block; font-size: 12px; color: rgba(255, 255, 255, 0.62); }
.prog { margin-top: 7px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.14); overflow: hidden; }
.prog i { display: block; height: 100%; width: 34%; border-radius: 2px; background: #fff; transition: width 1s linear; }
.ctl { display: flex; gap: 2px; }
.ctl i { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; }
.ctl svg { width: 17px; height: 17px; fill: #fff; }

/* Réponse : l'île s'ouvre, une puce « En réponse à », la barre d'écriture */
.ly-compose { flex-direction: column; align-items: stretch; justify-content: flex-end; gap: 8px; padding: 12px 14px 14px; }
.hint { font-size: 11.5px; color: rgba(255, 255, 255, 0.6); padding: 0 4px; }
.rchip { align-self: flex-start; display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 10px 0 4px; border-radius: 14px; font-size: 12px; background: rgba(255, 255, 255, 0.07); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1); }
.rchip .av { width: 20px; height: 20px; font-size: 10px; }
.rchip b { font-weight: 600; }
.rchip em { font-style: normal; opacity: 0.55; margin-left: 4px; }
.bar { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 6px 0 16px; border-radius: 23px; background: var(--card); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.06); font-size: 13.5px; }
.bar .tx { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; }
.bar .tx:empty::before { content: attr(data-ph); color: rgba(255, 255, 255, 0.4); }
.caret { display: inline-block; width: 1.5px; height: 1.1em; vertical-align: -0.18em; background: #fff; margin-left: 1px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.send { width: 34px; height: 34px; flex: none; border-radius: 50%; display: grid; place-items: center; background: #f2f2f5; }
.send svg { width: 15px; height: 15px; fill: #0b0b0f; }
.mic svg { width: 16px; height: 16px; fill: rgba(255, 255, 255, 0.7); }

/* Appel en cours */
.cav { position: relative; width: 52px; height: 52px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 20px; font-weight: 700; background: linear-gradient(135deg, #6d6ff2, #4338ca); box-shadow: 0 0 0 2px rgba(87, 242, 135, 0.7); animation: ring 1.6s ease-out infinite; }
@keyframes ring { 0% { box-shadow: 0 0 0 2px rgba(87, 242, 135, 0.7), 0 0 0 0 rgba(52, 199, 89, 0.5); } 70% { box-shadow: 0 0 0 2px rgba(87, 242, 135, 0.7), 0 0 0 10px rgba(52, 199, 89, 0); } }
.ctime { font-size: 12px; color: rgba(255, 255, 255, 0.7); display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.ctime i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.cbtn { display: flex; gap: 8px; margin-left: auto; }
.cbtn i { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, 0.08); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1); }
.cbtn i.hang { background: linear-gradient(180deg, #ff5a52, #d92f27); box-shadow: none; }
.cbtn svg { width: 17px; height: 17px; fill: #fff; }

/* Dépôt de fichier */
.ly-drop { justify-content: center; gap: 10px; font-size: 14px; font-weight: 600; }
.ly-drop svg { width: 20px; height: 20px; fill: #fff; }
.ly-file { flex-direction: column; align-items: stretch; justify-content: center; gap: 8px; padding: 12px 16px; }
.fchip { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; }
.fchip u { width: 30px; height: 36px; border-radius: 6px; background: linear-gradient(180deg, #ff5a52, #c4251d); display: grid; place-items: center; font-size: 8px; font-weight: 800; text-decoration: none; color: #fff; flex: none; }
.ly-file .q { font-size: 13px; color: rgba(255, 255, 255, 0.85); }
.ly-file .bar { height: 36px; font-size: 12px; }
/* Code de vérification */
.code { font-size: 22px; font-weight: 700; letter-spacing: 0.08em; font-variant-numeric: tabular-nums; margin-top: 1px; }

/* Le petit rond (mode gaming) et le rond de la musique */
.rond-art { position: absolute; inset: 2px; border-radius: 50%; background: var(--art) center / cover; opacity: 0; transition: opacity 0.3s ease 0.2s; }
.isl[data-s="rond"] .rond-art { opacity: 0.55; }
.orb { position: absolute; top: calc(8px * var(--k, 1)); left: 50%; width: 36px; height: 36px; border-radius: 50%; transform-origin: 0 0; transform: translateX(calc(86px * var(--k, 1))) scale(var(--k, 1)) translateX(-30px) scale(0.3); opacity: 0;
  transition: transform 0.45s cubic-bezier(0.2, 0.9, 0.25, 1.15), opacity 0.25s ease; background: var(--glass); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35); }
.orb.show { opacity: 1; transform: translateX(calc(86px * var(--k, 1))) scale(var(--k, 1)); }
.orb::after { content: ''; position: absolute; inset: 0; border-radius: 50%; padding: 1px; background: radial-gradient(circle 16px at 75% 0%, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.18) 45%, transparent 100%), radial-gradient(circle 12px at 25% 100%, rgba(255, 255, 255, 0.3), transparent 100%), linear-gradient(rgba(140, 140, 150, 0.16), rgba(140, 140, 150, 0.16));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.orb b { position: absolute; inset: 2px; border-radius: 50%; background: var(--art) center / cover; }
.orb.playing::before { content: ''; position: absolute; inset: -3px; border-radius: 50%; background: conic-gradient(from var(--a), rgba(255, 255, 255, 0) 0deg, rgba(255, 255, 255, 0.8) 40deg, rgba(255, 255, 255, 0) 110deg); -webkit-mask: radial-gradient(circle, transparent 18px, #000 19px); mask: radial-gradient(circle, transparent 18px, #000 19px); animation: spin 2.6s linear infinite; }
@keyframes spin { to { --a: 390deg; } }

/* La goutte (dessin de l'appli) */
.drop { position: absolute; left: 50%; top: 0; width: calc(100px * var(--k, 1)); transform: translateX(-50%); opacity: 0; transition: opacity 0.35s ease; pointer-events: none; }
.drop.show { opacity: 1; }
.drop svg { display: block; width: 100%; overflow: visible; }

/* =====================================================================
   ÉCRANS : un bureau Windows, la scène de MIRYS
   ===================================================================== */
.screen { position: relative; overflow: hidden; border-radius: 24px; background: #2a2340 url(img/wall.jpg) center / cover no-repeat; aspect-ratio: 16 / 9;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.09), 0 50px 120px -40px rgba(0, 0, 0, 0.9), 0 30px 80px -50px rgba(143, 122, 230, 0.5); --k: 1; }
.screen::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12); }
.walls { position: absolute; inset: 0; }
.walls i { position: absolute; inset: 0; opacity: 0; }
.walls i.on { opacity: 1; }
.taskbar { position: absolute; left: 50%; bottom: calc(10px * var(--k)); transform: translateX(-50%) scale(var(--k)); transform-origin: 50% 100%; display: flex; gap: 6px; padding: 7px 12px; border-radius: 12px; background: rgba(20, 18, 30, 0.55); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08); }
.taskbar i { width: 22px; height: 22px; border-radius: 6px; background: rgba(255, 255, 255, 0.16); }
.taskbar i:nth-child(1) { background: radial-gradient(circle at 30% 30%, #7cc4ff, #2f6fe0); }
.taskbar i:nth-child(2) { background: linear-gradient(180deg, #ffd56b, #f0a825); }
.taskbar i:nth-child(3) { background: linear-gradient(180deg, #8f7ae6, #5b46c9); }
.taskbar i:nth-child(4) { background: linear-gradient(180deg, #5ee0a0, #20a86a); }
.taskbar time { font-size: 10px; line-height: 1.1; text-align: right; color: rgba(255, 255, 255, 0.85); margin-left: 6px; font-variant-numeric: tabular-nums; }

/* La carte du briefing (intro de l'appli) : verre ouvert et reflet qui fait le tour */
.bcard { position: absolute; z-index: 4; left: 50%; top: 50%; width: 260px; height: 130px; border-radius: 32px; transform: translate(-50%, -50%) scale(var(--k)); background: var(--glass-open);
  box-shadow: 0 20px 30px -14px rgba(0, 0, 0, 0.5), 0 6px 14px -4px rgba(0, 0, 0, 0.28); overflow: hidden; opacity: 0;
  transition: width 0.75s cubic-bezier(0.2, 0.9, 0.22, 1.12), height 0.75s cubic-bezier(0.2, 0.9, 0.22, 1.12), opacity 0.5s ease, filter 0.6s ease, transform 0.75s cubic-bezier(0.2, 0.9, 0.22, 1.12), top 0.7s var(--land), border-radius 0.6s ease; }
.bcard.on { opacity: 1; }
.bcard.land { top: calc(8px * var(--k)); width: 160px !important; height: 36px !important; border-radius: 18px; transform: translate(-50%, 0) scale(var(--k)); box-shadow: 0 10px 34px rgba(0, 0, 0, 0.3); }
.bcard.land .layer { opacity: 0; filter: blur(10px); transition-duration: 0.25s; }
.bcard.gone { opacity: 0; transition: opacity 0.2s ease; }
.rim { position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; z-index: 2;
  background: conic-gradient(from var(--a), rgba(255, 255, 255, 0) 0deg, rgba(255, 255, 255, 0.55) 38deg, rgba(255, 255, 255, 0.12) 90deg, rgba(255, 255, 255, 0) 135deg, rgba(255, 255, 255, 0) 205deg, rgba(255, 255, 255, 0.25) 240deg, rgba(255, 255, 255, 0) 290deg), linear-gradient(rgba(140, 140, 150, 0.15), rgba(140, 140, 150, 0.15));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; animation: spin 16s linear infinite; }
.layer { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(0.97); opacity: 0; filter: blur(12px); white-space: nowrap; transition: opacity 0.55s ease, filter 0.6s ease, transform 0.7s var(--out); }
.layer.show { opacity: 1; filter: none; transform: translate(-50%, -50%); transition-delay: 0.12s; }
.layer.cut { transition: none !important; }
.greet { text-align: center; }
.g-small { font-size: 15px; font-weight: 500; letter-spacing: 3px; text-transform: uppercase; color: rgba(255, 255, 255, 0.5); margin-bottom: 4px; }
.g-name { font-family: var(--display); font-size: 46px; font-weight: 650; letter-spacing: -0.5px; line-height: 1.05; }
.binfo { display: flex; flex-direction: column; gap: 16px; }
.weather { display: flex; align-items: center; gap: 16px; }
.w-ico { width: 52px; height: 52px; flex: none; }
.w-temp { font-size: 44px; font-weight: 250; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
.w-text { width: 300px; white-space: normal; font-size: 15.5px; line-height: 1.38; font-weight: 500; color: rgba(255, 255, 255, 0.86); }
.chips { display: flex; gap: 8px; }

/* Sous-titres de la voix (ce que l'on dit), en bas de l'écran */
.said { position: absolute; left: 50%; bottom: calc(56px * var(--k)); transform: translateX(-50%) translateY(10px) scale(var(--k)); transform-origin: 50% 100%; display: flex; align-items: center; gap: 10px; padding: 9px 18px 9px 10px; border-radius: 999px;
  background: rgba(8, 8, 12, 0.72); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12), 0 16px 40px rgba(0, 0, 0, 0.4); font-size: 14px; white-space: nowrap; opacity: 0; transition: opacity 0.3s ease, transform 0.45s var(--out); }
.said.on { opacity: 1; transform: translateX(-50%) scale(var(--k)); }
.said .who { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #f7a072, #c06c84); flex: none; }

.game { position: absolute; inset: 0; opacity: 0; transition: opacity 0.5s ease; background: radial-gradient(60% 70% at 30% 70%, rgba(32, 168, 140, 0.55), transparent 70%), radial-gradient(50% 60% at 80% 20%, rgba(40, 90, 200, 0.5), transparent 70%), linear-gradient(160deg, #04121a, #0a2a33 55%, #071016); }
.game.on { opacity: 1; }
.game::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.025) 0 1px, transparent 1px 64px), repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.025) 0 1px, transparent 1px 64px); }
.game b { position: absolute; left: calc(24px * var(--k)); bottom: calc(22px * var(--k)); font-size: calc(11px * var(--k)); letter-spacing: 0.2em; color: rgba(255, 255, 255, 0.45); font-weight: 700; }
/* Fenêtre de mail dans l'écran */
.mwin { position: absolute; left: 50%; top: 51%; width: 470px; transform: translate(-50%, -50%) scale(calc(var(--k) * 0.98)) translateY(20px); transform-origin: 50% 50%; opacity: 0; border-radius: 22px; padding: 14px 16px 12px; background: linear-gradient(180deg, #0b0b10, rgba(11, 11, 16, 0.94)); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.09), 0 30px 70px rgba(0, 0, 0, 0.5); transition: opacity 0.4s ease, transform 0.6s var(--out); font-size: 12.5px; }
.mwin.on { opacity: 1; transform: translate(-50%, -50%) scale(calc(var(--k) * 0.93)); }

.field { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 12px; border-radius: 12px; background: rgba(255, 255, 255, 0.04); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.07); margin-bottom: 7px; }

.mbody { min-height: 104px; padding: 12px; border-radius: 12px; background: rgba(255, 255, 255, 0.04); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.07); white-space: pre-wrap; line-height: 1.5; color: rgba(255, 255, 255, 0.92); }
.mbody:empty::before { content: 'Votre message…'; color: rgba(255, 255, 255, 0.35); }
.mwin .askbar { display: flex; align-items: center; gap: 8px; margin-top: 6px; height: 32px; padding: 0 5px 0 12px; border-radius: 18px; background: rgba(110, 120, 255, 0.08); box-shadow: inset 0 0 0 1px rgba(150, 160, 255, 0.25); }
.mwin .askbar i { width: 7px; height: 7px; border-radius: 50%; background: #8b93ff; box-shadow: 0 0 8px #8b93ff; flex: none; }

.mwin .askbar u { text-decoration: none; height: 26px; padding: 0 11px; border-radius: 13px; display: grid; place-items: center; font-weight: 700; font-size: 11px; background: #f2f2f5; color: #0b0b0f; transition: transform 0.15s ease; }

/* ---------- La lumière (canvas plein écran, au-dessus de tout le reste) ---------- */
#fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 40; pointer-events: none; }

/* ---------- Veille ---------- */
.wake { position: fixed; inset: 0; z-index: 30; display: block; border: 0; padding: 0; background: transparent; cursor: pointer; }
.wake span { position: absolute; left: 50%; top: calc(var(--ledy, 30vh) + 64px); transform: translateX(-50%); font-family: var(--display); font-size: clamp(15px, 1.4vw, 18px); font-weight: 400; letter-spacing: 0.32em; text-transform: uppercase; color: rgba(255, 255, 255, 0.16); white-space: nowrap; transition: color 0.6s ease, opacity 0.6s ease, letter-spacing 1.2s var(--liquid); }

/* ---------- Les verres ---------- */
.pane { position: fixed; left: 50%; top: 0; z-index: 10; translate: var(--fx, 0px) var(--fy, 0px); transition: translate 1.1s cubic-bezier(0.22, 1, 0.36, 1); width: var(--pw); height: var(--ph); margin-left: calc(var(--pw) / -2); border-radius: 34px; isolation: isolate; visibility: hidden; will-change: transform; }

  box-shadow: 0 50px 160px rgba(0, 0, 0, 0.9); -webkit-mask-image: var(--reveal, none); mask-image: var(--reveal, none); }

.pane .ring { position: absolute; inset: 0; z-index: 7; border-radius: inherit; padding: 1px; pointer-events: none; opacity: 0; transition: opacity 0.6s ease;
  background:
    radial-gradient(circle var(--hr) at var(--hx) var(--hy), rgba(255, 255, 255, var(--pk)) 0%, rgba(255, 255, 255, calc(var(--pk) * 0.4)) 40%, rgba(255, 255, 255, 0) 100%),

    linear-gradient(rgba(150, 150, 160, 0.2), rgba(150, 150, 160, 0.2));

  --hr: 220px; transition: opacity 0.6s ease, --hx 0.6s cubic-bezier(0.25, 0.8, 0.3, 1), --hy 0.6s cubic-bezier(0.25, 0.8, 0.3, 1), --pk 0.5s ease; }
.pane.idle .ring { opacity: 1; }
/* Le noir qui gagne quand la lumière s'en va */
.pane .dim { position: absolute; inset: -72px -4px; z-index: 8; border-radius: inherit; pointer-events: none; background: var(--dim, transparent); }

/* La scène à l'intérieur : un bureau qui se fond dans le noir vers les coins */
.pane .screen { position: absolute; inset: 0; aspect-ratio: auto; border-radius: inherit; background: none; box-shadow: none; overflow: hidden; }
.pane .screen::after { display: none; }
.pane .wall { position: absolute; inset: 0; background: url(img/wall.jpg) center 30% / cover no-repeat; filter: brightness(0.62) saturate(1.1);
  -webkit-mask-image: radial-gradient(ellipse 72% 78% at 52% 34%, #000 28%, rgba(0, 0, 0, 0.55) 55%, transparent 86%); mask-image: radial-gradient(ellipse 72% 78% at 52% 34%, #000 28%, rgba(0, 0, 0, 0.55) 55%, transparent 86%); }
.pane .walls { -webkit-mask-image: radial-gradient(ellipse 72% 78% at 52% 34%, #000 28%, rgba(0, 0, 0, 0.55) 55%, transparent 86%); mask-image: radial-gradient(ellipse 72% 78% at 52% 34%, #000 28%, rgba(0, 0, 0, 0.55) 55%, transparent 86%); }

/* Le texte de la présentation : en bas à gauche, dans le noir */
.copy { position: absolute; z-index: 5; left: 5.5%; bottom: 8%; width: min(440px, 38%); display: flex; flex-direction: column; gap: 14px; }

.copy h2, .plain h2 { margin: 0; font-family: var(--display); font-size: clamp(34px, 3.9vw, 58px); font-weight: 700; letter-spacing: -0.035em; line-height: 1.02; text-wrap: balance; color: #f6f6f8; }
.copy p, .plain .lede { margin: 0; font-size: clamp(15px, 1.15vw, 17px); line-height: 1.55; color: var(--soft); text-wrap: pretty; }
.copy .acts2 { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }

/* Les mots arrivent du flou, comme dans MIRYS Mail ; ils repartent dans le flou */
.rv { opacity: 0; filter: blur(10px); transform: translateY(12px); }
.pane.shown .rv { animation: word-in 0.95s var(--liquid) forwards; animation-delay: var(--d, 0ms); }
.pane.leaving .rv { animation: word-out 0.5s var(--liquid) forwards; animation-delay: var(--o, 0ms); opacity: 1; filter: none; transform: none; }
@keyframes word-in { to { opacity: 1; filter: none; transform: none; } }
@keyframes word-out { from { opacity: 1; filter: none; transform: none; } to { opacity: 0; filter: blur(9px); transform: translateY(-10px); } }
.w { display: inline-block; }

/* Pastilles (boutons) façon MIRYS Mail */
.pill { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 18px 0 16px; border-radius: 999px; cursor: pointer; white-space: nowrap; text-decoration: none; border: 0; color: #fff; font-weight: 600; font-size: 14px;
  background: var(--glass); box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35); transition: transform 0.42s var(--ease-soft), box-shadow 0.45s ease; }
.pill::before { content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
  background: radial-gradient(circle 44px at 100% 0%, rgba(255, 255, 255, 0.55) 0%, rgba(255, 255, 255, 0.2) 40%, rgba(255, 255, 255, 0) 100%), radial-gradient(circle 33px at 0% 100%, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 100%), linear-gradient(rgba(140, 140, 150, 0.15), rgba(140, 140, 150, 0.15));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.pill:hover { transform: scale(1.04); box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45); }
.pill:active { transform: scale(0.97); }
.pill.white { color: #0b0b0e; background: linear-gradient(180deg, #fff, #e6e6eb); box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35), 0 0 22px rgba(255, 255, 255, 0.16); }
.pill.white::before { display: none; }
.pill svg { width: 16px; height: 16px; flex: none; }
.pill.sm { height: 34px; padding: 0 14px 0 12px; font-size: 13px; }
.seg { position: relative; display: inline-flex; padding: 3px; border-radius: 999px; background-color: var(--card); background-image: var(--card-sheen); border: 1px solid rgba(255, 255, 255, 0.09); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14); }
.seg button { position: relative; z-index: 1; height: 32px; padding: 0 15px; border: none; border-radius: 999px; background: none; color: var(--muted); cursor: pointer; font-size: 13px; font-weight: 600; transition: color 0.25s ease; }
.seg button[aria-selected='true'] { color: #0b0b0e; font-weight: 700; }
.seg-glow { position: absolute; top: 3px; left: 3px; height: 32px; border-radius: 999px; background: #fff; transition: transform 0.55s var(--liquid), width 0.55s var(--liquid); }

/* Présentations sans bureau : texte et cartes au centre du verre */
.plain { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 6% 7%; text-align: center; }
.plain .lede { max-width: 34em; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; width: 100%; max-width: 980px; margin-top: 8px; text-align: left; }
.tiles div { padding: 18px 18px 20px; border-radius: 22px; background-color: var(--card); background-image: var(--card-sheen); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 8px 22px rgba(0, 0, 0, 0.3); }
.tiles b { display: block; font-size: 15px; margin-bottom: 6px; }
.tiles span { font-size: 13.5px; line-height: 1.5; color: var(--soft); }
.price { display: flex; align-items: baseline; justify-content: center; gap: 12px; }
.price b { font-family: var(--display); font-size: clamp(64px, 8vw, 116px); font-weight: 700; letter-spacing: -0.045em; line-height: 0.95; background: linear-gradient(180deg, #fff, #c9c9d0); -webkit-background-clip: text; background-clip: text; color: transparent; }
.price span { font-size: 18px; color: var(--muted); }
.ticks { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 22px; color: var(--soft); font-size: 14.5px; }
.ticks li { display: flex; align-items: center; gap: 9px; }
.ticks li::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.ctas { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 4px; }
.fine { font-size: 12.5px; color: var(--muted); }
.vid { position: relative; width: min(860px, 100%); aspect-ratio: 16 / 9; border-radius: 22px; overflow: hidden; background: #000; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 30px 80px rgba(0, 0, 0, 0.6); }
.vid video { display: block; width: 100%; height: 100%; object-fit: cover; }
.vid button { position: absolute; inset: 0; border: 0; cursor: pointer; display: grid; place-items: center; background: linear-gradient(180deg, rgba(0, 0, 0, 0.05), rgba(0, 0, 0, 0.45)); }
.vid button span { display: inline-flex; align-items: center; gap: 10px; height: 54px; padding: 0 24px 0 18px; border-radius: 27px; font-weight: 700; color: #fff; background: var(--glass); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2), 0 20px 50px rgba(0, 0, 0, 0.5); transition: transform 0.4s var(--ease-soft); }
.vid button:hover span { transform: scale(1.05); }
.vid button svg { width: 20px; height: 20px; }
.wordmark { font-family: var(--mark); font-weight: 900; letter-spacing: 0.16em; margin-right: -0.16em; font-size: clamp(40px, 6vw, 84px); line-height: 1; background: linear-gradient(180deg, #fff 0%, #e9e9ee 40%, #8d8d98 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* ---------- Ce qui entoure le verre (discret) ---------- */
.chrome { position: fixed; z-index: 35; opacity: 0; pointer-events: none; transition: opacity 1.2s ease; }
body.awake .chrome { opacity: 1; pointer-events: auto; }
.brand { left: max(26px, env(safe-area-inset-left, 0px)); top: calc(22px + env(safe-area-inset-top, 0px)); font-family: var(--mark); font-weight: 900; font-size: 13px; letter-spacing: 0.32em; color: rgba(255, 255, 255, 0.42); }

.round:hover { background: rgba(255, 255, 255, 0.14); color: #fff; transform: scale(1.06); }

.dots button { position: relative; width: 22px; height: 18px; border: 0; padding: 0; background: none; cursor: pointer; }
.dots button::after { content: ''; position: absolute; right: 4px; top: 50%; width: 6px; height: 2px; border-radius: 1px; background: rgba(255, 255, 255, 0.22); transition: width 0.45s var(--liquid), background 0.4s ease; }
.dots button:hover::after { background: rgba(255, 255, 255, 0.5); width: 10px; }
.dots button[aria-current='true']::after { width: 16px; background: #fff; box-shadow: 0 0 8px rgba(255, 255, 255, 0.6); }
.dots button span { position: absolute; right: 28px; top: 50%; transform: translateY(-50%) translateX(6px); white-space: nowrap; font-size: 12px; color: rgba(255, 255, 255, 0.7); opacity: 0; pointer-events: none; transition: opacity 0.3s ease, transform 0.4s var(--liquid); }
.dots button:hover span { opacity: 1; transform: translateY(-50%); }
.hint { left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; align-items: center; gap: 12px; font-size: 11.5px; letter-spacing: 0.24em; text-transform: uppercase; color: rgba(255, 255, 255, 0.32); white-space: nowrap; font-variant-numeric: tabular-nums; }
.hint i { position: relative; width: 1px; height: 22px; overflow: hidden; background: rgba(255, 255, 255, 0.1); }
.hint i::after { content: ''; position: absolute; left: 0; top: -60%; width: 1px; height: 60%; background: rgba(255, 255, 255, 0.8); animation: trickle 1.8s var(--liquid) infinite; }
@keyframes trickle { to { top: 110%; } }
body.moving .hint { opacity: 0.35; }

@media (max-width: 760px) {
  .copy { left: 6%; right: 6%; width: auto; bottom: 6%; gap: 10px; }
  .copy h2, .plain h2 { font-size: 30px; }
  .pane .said { top: 24%; }
  .pane .bcard { top: 33%; }
  .pane .bcard.land { top: calc(8px * var(--k)); }
  .pane .mwin { left: 50%; top: 36%; }
  .tiles { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
  .tiles div { padding: 12px; }
  .tiles span { font-size: 12px; }

  .brand { display: none; }

}
@media (max-width: 760px) and (max-height: 760px) { .tiles span { display: none; } }

  <a class="pill sm white" href="https://github.com/ShiroUNKW/nova-releases/releases/latest" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M12 3a1 1 0 0 1 1 1v9.6l3.3-3.3 1.4 1.4L12 17.4l-5.7-5.7 1.4-1.4 3.3 3.3V4a1 1 0 0 1 1-1zM5 19h14v2H5z"/></svg>Télécharger</a>

<script>
(() => {
  'use strict';
  // Lien de paiement Lemon Squeezy : à coller ici quand il est prêt (sinon « Prendre ma licence » mène au Discord)
  const PAY_URL = '';
  const DL = 'https://github.com/ShiroUNKW/nova-releases/releases/latest';
  const DISCORD = 'https://discord.gg/TTJYqadAh';
  const BUY = PAY_URL || DISCORD;

  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, reduce ? Math.min(ms, 60) : ms));
  const tw = async (tok, ms) => { await wait(ms); if (tok.dead) throw 'stop'; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const eio = (t) => (t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2);
  const eout = (t) => 1 - (1 - t) ** 3;

  // ---------- Son : les bruits de MIRYS, et le « plic » de la goutte (synthétisé) ----------
  let muted = false, actx = null;
  const sfx = {};
  const play = (n, v = 0.35) => { if (muted || !document.body.classList.contains('awake')) return; try { const a = (sfx[n] = sfx[n] || new Audio(`sons/${n}.mp3`)); a.volume = v; a.currentTime = 0; a.play().catch(() => {}); } catch (e) {} };
  function plic(gain = 0.22, f0 = 1500, f1 = 380) {

  // Contour d'un rectangle arrondi, paramétré par la longueur (0 = milieu du haut, sens horaire)
  function perim(x, y, w, h, r) {

  // ---------- Particules d'éclaboussure ----------
  let sparks = [];

  function splash(x, y, dir = 1) {
    for (let k = 0; k < 34; k++) {

      sparks.push({ x, y: y + camY, vx: Math.cos(ang) * sp * (0.6 + Math.random()), vy: Math.sin(ang) * sp, r: 0.6 + Math.random() * 1.9, life: 0.5 + Math.random() * 0.7, t: 0 });

  // ---------- Le moteur : une scène = une fonction de dessin par image ----------
  let draw = null, last = 0, running = false, scrub = null;
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000 || 0.016); last = now;
    ctx.clearRect(0, 0, cv.width, cv.height);

    if (moving) { ctx.save(); for (const d of dust) { const yy = ((d.y * H - camY * d.z) % (H * 1.2) + H * 1.2) % (H * 1.2) - H * 0.1; ctx.fillStyle = `rgba(255,255,255,${d.a * moving})`; ctx.beginPath(); ctx.arc(d.x * W * dpr, yy * dpr, d.r * dpr, 0, Math.PI * 2); ctx.fill(); } ctx.restore(); }

  // ---------- Veille : le voyant blanc, lointain, qui respire ----------
  const B = document.body;
  const LED0 = [226, 234, 255]; let ledColor = LED0.slice(), ledPow = 0; // veille : un blanc froid et lointain, comme Nova
  draw = (t) => {
    const { x, y } = LED(); const b = 0.5 + 0.5 * Math.sin(t * 1.9); // respiration lente

  // =====================================================================

  // =====================================================================
  let cur = -1, busy = false;

  // Le verre se dévoile en fondu, du haut vers le bas (ou l'inverse)
  function setReveal(p, f, fromTop = true) {
    const g = $('.glass', p.el);
    if (f >= 1) { g.style.removeProperty('--reveal'); return; }
    const e = f * 170;
    g.style.setProperty('--reveal', `linear-gradient(${fromTop ? 180 : 0}deg, #000 ${e - 70}%, rgba(0,0,0,0.78) ${e - 46}%, rgba(0,0,0,0.48) ${e - 26}%, rgba(0,0,0,0.18) ${e - 10}%, transparent ${e}%)`);
  }
  // Le noir gagne en douceur, par paliers
  function setDim(p, prog, down = true) {
    const d = $('.dim', p.el), e = prog * 190 - 14;
    d.style.setProperty('--dim', prog <= 0 ? 'transparent' : `linear-gradient(${down ? 180 : 0}deg, #000 ${e - 86}%, rgba(0,0,0,0.85) ${e - 62}%, rgba(0,0,0,0.6) ${e - 40}%, rgba(0,0,0,0.3) ${e - 20}%, rgba(0,0,0,0.1) ${e - 6}%, rgba(0,0,0,0) ${e + 6}%)`);
  }
  // Rectangle réel du verre à l'écran (il suit aussi la souris)
  const rectOf = (i) => { const p = panes.get(i); if (p) { const r = p.el.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height, r: 34 }; } return { x: (W - PW) / 2, y: paneTop(i) - camY, w: PW, h: PH, r: 34 }; };
  // La bordure en lumière, en fondu vertical : 'in' = allumée au-dessus du front, 'out' = allumée en dessous
  function rimFade(R, f, mode, a = 1, fromTop = true, bk = 0) { // bk : 0 = bord net, 1 = bord entièrement flouté

    const grad = (base, peak) => {
      const g = fromTop ? ctx.createLinearGradient(0, y0, 0, y1) : ctx.createLinearGradient(0, y1, 0, y0);
      const c = (v) => clamp(v, 0, 1), A = (x) => `rgba(255,255,255,${x})`;
      if (mode === 'in') { g.addColorStop(0, A(base)); g.addColorStop(c(f - band), A(base)); g.addColorStop(c(f - band * 0.35), A(peak)); g.addColorStop(c(f), A(0)); g.addColorStop(1, A(0)); }
      else { g.addColorStop(0, A(0)); g.addColorStop(c(f), A(0)); g.addColorStop(c(f + band * 0.35), A(peak)); g.addColorStop(c(f + band), A(base)); g.addColorStop(1, A(base)); }

  // L'arrivée : éclaboussure, la bordure s'allume en fondu du haut vers le bas, le verre se dévoile, puis se pose
  async function reveal(i, fromTop = true) {
    const p = getPane(i); resetPane(p); p.el.classList.remove('idle', 'shown', 'leaving'); const gl0 = $('.glass', p.el); gl0.style.transform = ''; gl0.style.filter = ''; $('.ring', p.el).style.opacity = '';
    setDim(p, 0); setReveal(p, 0, fromTop); p.el.classList.add('live'); place(p);
    const c0 = camY, c1 = camTo(i);
    let R = rectOf(i);
    if (SPLASH) splash(R.x + R.w / 2, fromTop ? R.y : R.y + R.h, fromTop ? 1 : -1); // atterrissage silencieux
    setTimeout(() => { p.el.classList.add('shown'); setTimeout(() => startDemo(p), 800); }, 550);
    kick();
    await anim(2300, (q) => {
      camY = lerp(c0, c1, eio(clamp(q / 0.62, 0, 1))); place(p); R = rectOf(i);
      const f = eout(clamp(q / 0.85, 0, 1)) * 1.1, fl = SPLASH ? clamp(q * 2, 0, 1) : eout(clamp(q / 0.2, 0, 1));
      const sp = eout(clamp(q / 0.16, 0, 1)), spA = 1 - smooth(0.12, 0.42, q); // la lumière file le long du bord (~370 ms)
      const ab = clamp(q / 0.085, 0, 1); // la goutte est bue par le bord du verre (~200 ms)

  // ---------- Le départ, piloté par la molette ----------
  // pull : 0 = au repos ; vers 1 la présentation s'éteint et la goutte se forme ; à 1 elle tombe. Négatif = vers le haut.
  let pull = 0, pullT = 0, lastIn = 0, jump = null;
  const NEED = 1;
  function applyPull(p, v) {
    const a = Math.abs(v), down = v >= 0, sgn = down ? 1 : -1;
    const P = getPane(cur), gl = $('.glass', P.el), ring = $('.ring', P.el);
    const dim = smooth(0, 0.82, a);
    setDim(P, dim, down);
    gl.style.transform = a ? `translateY(${sgn * 50 * dim}px) scale(${1 - 0.02 * dim})` : ''; gl.style.filter = a ? `blur(${6 * dim}px)` : '';
    ring.style.opacity = a ? String(1 - smooth(0, 0.3, a)) : '';
    P.el.classList.toggle('leaving', a > 0.16); if (a < 0.08 && !P.el.classList.contains('shown')) P.el.classList.add('shown');
    if (a > 0.16) P.el.classList.remove('shown');
    // la caméra accompagne la lumière quand la goutte se forme
    const R0 = { x: (W - PW) / 2, y: paneTop(cur) - camTo(cur), w: PW, h: PH };
    const edgeY = down ? R0.y + R0.h : R0.y, aim = down ? H * 0.42 : H * 0.58;
    camY = camTo(cur) + (edgeY - aim) * smooth(0.55, 1, a); place(P);
    const R = rectOf(cur), sx = R.x + R.w / 2, sy = down ? R.y + R.h : R.y;
    const bk = smooth(0.08, 0.6, a);                                      // la bordure se floute dès que la lumière se canalise
    const f = smooth(0, 0.9, a) * 0.8;                                    // le front s'arrête avant le bas : la bordure reste un peu visible
    const lg = smooth(0.34, 0.9, a), s = smooth(0.52, 1, a);              // la lumière se rassemble, puis la goutte grossit
    const ra = 1 - 0.62 * smooth(0.34, 0.85, a);                          // elle s'atténue, mais ne s'éteint qu'au départ de la goutte
    const pw = (R.w - 30) * (1 - 0.18 * lg), pa = 0.12 + 0.38 * lg;
    const r = 1 + 8 * s, d = r * (0.3 + 2 * s), neck = r * (1 - 0.7 * s), soft = 9 - 4.4 * s;

  scrub = (dt) => {
    if (busy || cur < 0) return;

    if (idle && jump == null) pullT *= 0.965; // sans action, la goutte se résorbe doucement
    // pas de suivant (ou de précédent) : on peut tirer un peu, puis ça résiste
    if (pullT > 0 && cur >= CH.length - 1) pullT = Math.min(pullT, 0.32);

    else if (pull <= -NEED * 0.995 && cur > 0) drop(-1, g);
  };
  async function drop(dir, g) {
    busy = true; const from = cur; const to = jump != null ? jump : from + dir; jump = null;
    pull = pullT = 0; stopDemo(getPane(from));
    const pf = getPane(from), pt = getPane(to);
    const sgn = dir > 0 ? 1 : -1, r0 = g.r, d0 = g.d;
    await anim(560, (k) => {
      const e = eio(k), pw = lerp(g.pw, 10, e), pa = lerp(g.pa, 1, e) * (1 - smooth(0.75, 1, k));
      g.r = lerp(r0, 10, e); g.d = lerp(d0, 10 * 2.6, e);

    });
    g.ra *= 0.55;

      const srcWorld = g.sy + camY, sWorld = g.sy + g.d + camY;

    } else {
      const srcWorld = g.sy + camY, sWorld = g.sy - g.d + camY;
      await follow(g.sx, sWorld, paneTop(to) + PH, g.sy - g.d, { place: () => { place(pf); place(pt); }, draw: (q) => { rimFade(rectOf(from), g.f, 'out', g.ra * (1 - smooth(0, 0.22, q)), false, 1); remnant(g.sx, srcWorld - camY, q * 1.4, -1); approach(to, H * 0.5, -1); } }, -1);
    }
    pf.el.classList.remove('live', 'leaving'); setDim(pf, 0); $('.glass', pf.el).style.transform = ''; $('.glass', pf.el).style.filter = '';
    cur = to; ui(); setHash(CH[cur].id);
    await reveal(to, dir > 0);

  }

  // La goutte tombe (ou remonte) et la caméra la suit : elle reste au milieu, le verre suivant vient à sa rencontre
  async function follow(sx, sWorld, eWorld, sy0, extra, dir = 1) {
    const T = clamp(Math.sqrt(Math.max(1, Math.abs(eWorld - sWorld)) / H) * 1350, 1150, 2000);
    const FOLLOW = H * 0.5;
    B.classList.add('moving'); let prevY = sWorld;
    await anim(T, (q) => {
      const k = dir > 0 ? q * q : eio(q);
      const wy = lerp(sWorld, eWorld, k), v = Math.abs(wy - prevY) / 0.016; prevY = wy;
      const syNow = lerp(sy0, FOLLOW, eio(clamp(q / 0.6, 0, 1)));
      camY = wy - syNow; moving = Math.sin(Math.PI * Math.min(1, q * 1.2)) * 0.9;
      extra.place();
      draw = () => { extra.draw(q); if (dir > 0) falling(sx, syNow, 10, v, 1, q * T / 1000); else bead(sx, syNow, 8, 8.6, 0.9); };
    });

  }

  // ---------- Réveil ----------
  async function wake(target = 0) {
    if (busy || cur >= 0) return; busy = true;
    $('#wake').classList.add('gone'); B.classList.add('waking');
    try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    const { x, y } = LED();
    hum();
    // la lumière devient blanche et grandit, petit à petit
    await anim(1700, (q) => {
      const e = eio(q); ledColor = LED0.map((c) => Math.round(lerp(c, 255, e)));
      draw = () => { ctx.save(); ctx.globalCompositeOperation = 'lighter'; const c = ledColor.join(','); glow(x, y, 120 + 150 * e, 0.12 + 0.14 * e, c); glow(x, y, 26 + 22 * e, 0.6 + 0.3 * e, c); glow(x, y, 4.5 + 3 * e, 1, '255,255,255'); ctx.restore(); };
    });
    // elle s'accumule en goutte, d'abord très floue, puis de plus en plus nette
    await anim(1500, (q) => {
      const e = eio(q), r = 2 + 8 * e, d = r * (0.3 + 2.4 * e), neck = r * (1 - 0.85 * e), soft = 9 - 6.6 * e;
      draw = () => { ctx.save(); ctx.globalCompositeOperation = 'lighter'; glow(x, y, 270 - 80 * e, 0.26 - 0.1 * e); glow(x, y, 46, 0.85 - 0.35 * e); ctx.restore(); hanging(x, y + 2, d, r, neck, 9, Math.min(1, 0.4 + e), 1, soft); };
    });
    B.classList.add('awake');
    const pt = getPane(target); pt.el.classList.add('live'); setReveal(pt, 0);
    const ledWorld = y + camY, d0 = 10 * 2.7;
    await follow(x, y + 2 + d0 + camY, paneTop(target), y + 2 + d0, {
      place: () => place(pt),
      draw: (q) => { const ly = ledWorld - camY; ctx.save(); ctx.globalCompositeOperation = 'lighter'; glow(x, ly, 70, 0.3 * (1 - q)); glow(x, ly, 5, 0.8 * (1 - q)); ctx.restore(); remnant(x, ly + 2, q * 1.6); approach(target, H * 0.5); },
    });
    cur = target; ui(); setHash(CH[cur].id);
    await reveal(target, true);
    busy = false; lastIn = 0;
  }
  $('#wake').addEventListener('click', () => wake(0));

  // ---------- Navigation : la molette (ou le doigt) pilote la goutte ----------
  const dots = $('#dots');
  dots.innerHTML = CH.map((c, i) => `<button type="button" aria-label="${c.label}"><span>${c.label}</span></button>`).join('');
  $$('button', dots).forEach((b, i) => b.addEventListener('click', () => autoTo(i)));
  function autoTo(i) { if (busy || cur < 0 || i === cur || i < 0 || i >= CH.length) return; jump = i; lastIn = performance.now(); pullT = i > cur ? 1.06 : -1.06; }
  function ui() {
    $$('button', dots).forEach((b, i) => b.setAttribute('aria-current', i === cur));
    $('#count').textContent = `${String(cur + 1).padStart(2, '0')} / ${CH.length}`;
    $('#hint').lastElementChild.textContent = cur === CH.length - 1 ? 'Remontez quand vous voulez' : 'Faites défiler';
  }
  addEventListener('wheel', (e) => {
    if (cur < 0) return; e.preventDefault(); if (busy) return;
    const dy = e.deltaMode === 1 ? e.deltaY * 36 : e.deltaMode === 2 ? e.deltaY * H : e.deltaY;
    jump = null; lastIn = performance.now(); pullT = clamp(pullT + dy / 900, -1.06, 1.06);
  }, { passive: false });
  let ty = null, tp = 0;
  addEventListener('touchstart', (e) => { ty = e.touches[0].clientY; tp = pullT; }, { passive: true });
  addEventListener('touchmove', (e) => { if (ty == null || cur < 0 || busy) return; jump = null; lastIn = performance.now(); pullT = clamp(tp + (ty - e.touches[0].clientY) / (H * 0.55), -1.06, 1.06); }, { passive: true });
  addEventListener('touchend', () => { ty = null; }, { passive: true });
  addEventListener('keydown', (e) => {
    if (cur < 0) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); wake(0); } return; }
    if (['ArrowDown', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); autoTo(cur + 1); }
    if (['ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); autoTo(cur - 1); }
  });
  $('#mute').addEventListener('click', (e) => { muted = !muted; e.currentTarget.setAttribute('aria-pressed', muted); e.currentTarget.style.opacity = muted ? 0.45 : 1; });

  // Le verre suit un peu la souris (haut / bas), et son reflet suit le curseur
  addEventListener('pointermove', (e) => {
    document.documentElement.style.setProperty('--fy', `${((e.clientY / H) - 0.5) * 26}px`);
    document.documentElement.style.setProperty('--fx', `${((e.clientX / W) - 0.5) * 8}px`);
    const p = panes.get(cur); if (!p) return;
    const r = p.el.getBoundingClientRect(), ring = $('.ring', p.el);
    const cx = clamp(e.clientX, r.left, r.right), cy = clamp(e.clientY, r.top, r.bottom), d = Math.hypot(e.clientX - cx, e.clientY - cy);
    ring.style.setProperty('--hx', `${((cx - r.left) / r.width) * 100}%`); ring.style.setProperty('--hy', `${((cy - r.top) / r.height) * 100}%`); ring.style.setProperty('--pk', (0.32 + 0.6 * Math.exp(-d / 240)).toFixed(3));
    p.el.style.setProperty('--mx', `${e.clientX - r.left}px`); p.el.style.setProperty('--my', `${e.clientY - r.top}px`);
  }, { passive: true });

  addEventListener('resize', () => { layout(); size(); document.documentElement.style.setProperty('--ledy', LED().y + 'px'); if (cur >= 0) { camY = camTo(cur); panes.forEach(place); } });
  function setHash(id) { try { history.replaceState(null, '', `#${id}`); } catch (e) {} }
  // Lien direct (…#tarif) : MIRYS se réveille et la goutte tombe directement sur la bonne présentation
  const h = location.hash.slice(1), hi = CH.findIndex((c) => c.id === h);
  if (hi >= 0) setTimeout(() => wake(hi), 700);
})();
</script>

</body>
</html>
